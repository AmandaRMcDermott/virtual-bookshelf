---
name: AWS Bedrock - Configurations
version: 0.0.1
schema: v1
models:
  - name: AWS Bedrock - Claude 3.7 Sonnet
    provider: bedrock
    model: arn:aws-us-gov:bedrock:us-gov-west-1::foundation-model/anthropic.claude-3-7-sonnet-20250219-v1:0
    env:
      region: us-gov-west-1
      profile: bedrock
    roles:
      - chat
      - edit
      - apply
      - summarize
    defaultCompletionOptions:
      temperature: 0.5
      maxTokens: 8192
  - name: AWS Bedrock - Claude 4.5 Sonnet
    provider: bedrock
    model: arn:aws-us-gov:bedrock:us-gov-west-1:291091201459:inference-profile/us-gov.anthropic.claude-sonnet-4-5-20250929-v1:0
    env:
      region: us-gov-west-1
      profile: bedrock
    roles:
      - chat
      - edit
      - apply
      - summarize
    defaultCompletionOptions:
      temperature: 0.5
      maxTokens: 8192
context:
  - provider: codebase
  - provider: code
  - provider: open
  - provider: problems
  - provider: currentFile
  - provider: docs
  - provider: diff
  - provider: folder
  - provider: terminal
rules:
  - Act as an expert software developer that can write code that is clean,
    efficient, and well-documented as well as write unit tests for the code
    proposed
  - Give concise responses
  - Always annotate functions with their parameter and return types
