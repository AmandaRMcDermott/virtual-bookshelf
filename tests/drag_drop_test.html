<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag and Drop Test | Virtual Bookshelf</title>
    <link rel="stylesheet" href="../css/original_spines.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .test-controls {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f0f0f0;
            border-radius: 8px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }

        .test-section {
            margin-bottom: 30px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
        }

        .status {
            padding: 15px;
            margin-top: 20px;
            background-color: #f8f9fa;
            border-left: 4px solid #4caf50;
        }

        .book {
            width: 40px;
            height: 150px;
            margin-right: 2px;
        }

        .test-book-red {
            background-color: #e74c3c;
        }

        .test-book-green {
            background-color: #2ecc71;
        }

        .test-book-blue {
            background-color: #3498db;
        }

        .test-book-purple {
            background-color: #9b59b6;
        }

        .test-book-orange {
            background-color: #e67e22;
        }

        .event-log {
            height: 200px;
            overflow-y: scroll;
            border: 1px solid #ddd;
            padding: 10px;
            font-family: monospace;
            background-color: #f8f9fa;
            margin-top: 20px;
        }

        .event-log .info {
            color: #2980b9;
        }

        .event-log .warn {
            color: #e67e22;
        }

        .event-log .error {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <h1>Drag and Drop Test</h1>
    <p>Use this page to test the drag and drop functionality for books in the Virtual Bookshelf.</p>

    <div class="test-controls">
        <button id="add-books">Add Test Books</button>
        <button id="clear-books">Clear Books</button>
        <button id="toggle-debug">Toggle Debug Mode</button>
        <button id="reset-log">Clear Event Log</button>
    </div>

    <div class="test-section">
        <h2>Test Bookshelf</h2>
        <div class="bookshelf" id="test-bookshelf">
            <div class="bookshelf-row" id="shelf-1">
                <!-- Books will be added here -->
            </div>
            <div class="bookshelf-row" id="shelf-2">
                <!-- Books will be added here -->
            </div>
            <div class="bookshelf-row" id="shelf-3">
                <!-- Books will be added here -->
            </div>
        </div>
    </div>

    <div class="test-section">
        <h2>Removed Books</h2>
        <div id="removed-books-container">
            <!-- Removed books go here -->
        </div>
    </div>

    <div class="test-section">
        <h2>Event Log</h2>
        <div class="event-log" id="event-log"></div>
    </div>

    <script src="../js/drag_manager.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Override console.log to capture events in the event log
            const eventLog = document.getElementById('event-log');
            const originalConsoleLog = console.log;
            const originalConsoleWarn = console.warn;
            const originalConsoleError = console.error;

            console.log = function(...args) {
                originalConsoleLog.apply(console, args);
                const message = args.map(arg =>
                    typeof arg === 'object' ? JSON.stringify(arg) : arg
                ).join(' ');
                logEvent('info', message);
            };

            console.warn = function(...args) {
                originalConsoleWarn.apply(console, args);
                const message = args.map(arg =>
                    typeof arg === 'object' ? JSON.stringify(arg) : arg
                ).join(' ');
                logEvent('warn', message);
            };

            console.error = function(...args) {
                originalConsoleError.apply(console, args);
                const message = args.map(arg =>
                    typeof arg === 'object' ? JSON.stringify(arg) : arg
                ).join(' ');
                logEvent('error', message);
            };

            function logEvent(type, message) {
                const entry = document.createElement('div');
                entry.className = type;
                entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
                eventLog.appendChild(entry);
                eventLog.scrollTop = eventLog.scrollHeight;
            }

            // Elements
            const addBooksBtn = document.getElementById('add-books');
            const clearBooksBtn = document.getElementById('clear-books');
            const toggleDebugBtn = document.getElementById('toggle-debug');
            const resetLogBtn = document.getElementById('reset-log');
            const testBookshelf = document.getElementById('test-bookshelf');
            let debugMode = false;

            // Add test books
            addBooksBtn.addEventListener('click', function() {
                addTestBooks();
            });

            // Clear books
            clearBooksBtn.addEventListener('click', function() {
                clearBooks();
            });

            // Toggle debug mode
            toggleDebugBtn.addEventListener('click', function() {
                debugMode = !debugMode;
                document.body.classList.toggle('debug-mode', debugMode);
                document.querySelectorAll('.book-debug').forEach(el => {
                    el.style.display = debugMode ? 'block' : 'none';
                });
                this.textContent = debugMode ? 'Hide Debug Info' : 'Toggle Debug Mode';
                logEvent('info', `Debug mode ${debugMode ? 'enabled' : 'disabled'}`);
            });

            // Reset log
            resetLogBtn.addEventListener('click', function() {
                eventLog.innerHTML = '';
            });

            // Initialize DragManager
            DragManager.init('#test-bookshelf');
            logEvent('info', 'DragManager initialized');

            // Add test books
            function addTestBooks() {
                logEvent('info', 'Adding test books');

                // Add to first shelf
                const shelf1 = document.getElementById('shelf-1');
                addTestBook(shelf1, 'red', 'Book 1');
                addTestBook(shelf1, 'green', 'Book 2');
                addTestBook(shelf1, 'blue', 'Book 3');

                // Add to second shelf
                const shelf2 = document.getElementById('shelf-2');
                addTestBook(shelf2, 'purple', 'Book 4');
                addTestBook(shelf2, 'orange', 'Book 5');

                // Add to third shelf
                const shelf3 = document.getElementById('shelf-3');
                addTestBook(shelf3, 'red', 'Book 6');
                addTestBook(shelf3, 'green', 'Book 7');

                logEvent('info', 'Test books added');
            }

            // Add a single test book
            function addTestBook(shelf, color, label) {
                const book = document.createElement('div');
                book.className = `book test-book-${color}`;
                book.dataset.bookId = `test-${Date.now()}-${Math.random().toString(36).substring(2, 9)}`;
                book.dataset.label = label;

                // Add debug element
                const debug = document.createElement('div');
                debug.className = 'book-debug';
                debug.style.display = debugMode ? 'block' : 'none';
                debug.style.position = 'absolute';
                debug.style.top = '-20px';
                debug.style.left = '0';
                debug.style.fontSize = '10px';
                debug.style.color = 'white';
                debug.style.backgroundColor = 'black';
                debug.textContent = label;
                book.appendChild(debug);

                // Add book spine
                const spine = document.createElement('div');
                spine.className = 'book-spine';
                spine.style.width = '100%';
                spine.style.height = '100%';
                spine.style.display = 'flex';
                spine.style.alignItems = 'center';
                spine.style.justifyContent = 'center';
                spine.textContent = label;
                spine.style.color = 'white';
                spine.style.fontWeight = 'bold';
                spine.style.writingMode = 'vertical-rl';
                spine.style.textOrientation = 'mixed';
                book.appendChild(spine);

                // Make book draggable
                DragManager.makeBookDraggable(book);

                // Add to shelf
                shelf.appendChild(book);

                logEvent('info', `Added ${label} to ${shelf.id}`);
                return book;
            }

            // Clear all books
            function clearBooks() {
                document.querySelectorAll('.bookshelf-row').forEach(shelf => {
                    while (shelf.firstChild) {
                        shelf.removeChild(shelf.firstChild);
                    }
                });

                const removedContainer = document.getElementById('removed-books-container');
                while (removedContainer.firstChild) {
                    removedContainer.removeChild(removedContainer.firstChild);
                }

                logEvent('info', 'All books cleared');
            }

            // Add initial test books
            addTestBooks();
        });
    </script>
</body>
</html>
