<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Bookshelf - Smooth Sortable Drag and Drop</title>

    <!-- SortableJS - Smooth drag and drop library -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

    <style>
        /* Theme Color Variables */
        :root {
            /* Light mode colors (default) */
            --bg-primary: #f5f5f5;
            --bg-secondary: #fff;
            --bg-header: #34495e;
            --bg-panel: #fff;
            --bg-shelf: #6f3a1f;
            --bg-shelf-base: #844213ff;
            --bg-shelf-shadow: #4d1e06ff;
            --text-primary: #333;
            --text-light: white;
            --border-shelf: #4a2511;
            --border-panel: #ddd;
            --button-primary: #3498db;
            --button-hover: #57ce8cff;
            --shadow-book: rgba(0, 0, 0, 0.3);
            --shadow-panel: rgba(0, 0, 0, 0.1);
            --info-gradient-start: #667eea;
            --info-gradient-end: #764ba2;
        }

        /* Dark mode color overrides */
        body.dark-mode {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2a2a2a;
            --bg-header: #2c3e50;
            --bg-panel: #2a2a2a;
            /* OLD COLOR: #6f3a1f */
            --bg-shelf: #5a2f18;
            /* OLD COLOR: #844213ff */
            --bg-shelf-base: #6b3410;
            --bg-shelf-shadow: #4d1e06ff;
            --text-primary: #e0e0e0;
            --text-light: #e0e0e0;
            --border-shelf: #3a1f11;
            --border-panel: #444;
            --button-primary: #3498db;
            --button-hover: #57ce8cff;
            --shadow-book: rgba(0, 0, 0, 0.5);
            --shadow-panel: rgba(0, 0, 0, 0.3);
            --info-gradient-start: #556cd6;
            --info-gradient-end: #5d3d7a;
        }

        /* Main application styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            background-color: var(--bg-primary);
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            background-color: var(--bg-header);
            color: var(--text-light);
            padding: 1rem;
            box-shadow: 0 2px 5px var(--shadow-panel);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 15px;
            background-color: var(--button-primary);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: var(--button-hover);
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        footer {
            text-align: center;
            padding: 1rem;
            margin-top: 2rem;
            background-color: var(--bg-header);
            color: var(--text-light);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Bookshelf styles */
        .bookshelf-container {
            margin-top: 20px;
        }

        /* Flexbox layout for main app */
        .app-container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .bookshelf-main-area {
            flex: 1;
            min-width: 0;
        }

        .side-panel {
            width: 350px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Settings Section */
        .settings-section {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-panel);
            border-radius: 8px;
            overflow: hidden;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .settings-header {
            padding: 12px 15px;
            background-color: var(--bg-header);
            color: var(--text-light);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .settings-header:hover {
            opacity: 0.9;
        }

        .toggle-arrow {
            transition: transform 0.3s ease;
        }

        .settings-header.collapsed .toggle-arrow {
            transform: rotate(-90deg);
        }

        .settings-content {
            padding: 15px;
            max-height: 500px;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
        }

        .settings-content.collapsed {
            max-height: 0;
            padding: 0 15px;
        }

        .setting-group {
            margin-bottom: 15px;
        }

        .setting-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .setting-group input[type="number"] {
            width: 80px;
            padding: 6px 8px;
            border: 1px solid var(--border-panel);
            border-radius: 4px;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            margin-right: 10px;
        }

        .small-btn {
            padding: 6px 12px;
            font-size: 0.85rem;
            background-color: var(--button-primary);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .small-btn:hover {
            background-color: var(--button-hover);
        }

        /* Temporary Holding Section */
        .temporary-holding-section {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-panel);
            border-radius: 8px;
            overflow: hidden;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 300px;
        }

        .holding-header {
            padding: 12px 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .count-badge {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .holding-area {
            padding: 15px;
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 10px;
            align-content: start;
        }

        /* Responsive design */
        @media (max-width: 1024px) {
            .app-container {
                flex-direction: column;
            }

            .side-panel {
                width: 100%;
            }
        }

        .bookshelf {
            width: 100%;
            box-sizing: border-box;
            background-color: #d4a574;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        body.dark-mode .bookshelf {
            background-color: #8b6f47;
        }

        .bookshelf-row {
            width: 100%;
            white-space: nowrap;
            overflow-x: auto;
            display: flex;
            flex-wrap: nowrap;
            flex-direction: row !important;
            padding: 8px 2px;
            background: var(--bg-shelf);
            border: 8px solid var(--border-shelf);
            transition: background-color 0.3s ease;
            position: relative;
            align-items: flex-end;
            min-height: 150px;
            margin-bottom: 20px;
        }

        .bookshelf-row:last-child {
            margin-bottom: 0;
        }

        .bookshelf-row::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 15px;
            background-color: var(--bg-shelf-base);
            box-shadow: 0px -15px 25px 0px var(--bg-shelf-shadow),
                /* box-shadow: 0px -15px 25px 0px var(--bg-shelf-shadow), */
                inset 0px 42px 20px -25px var(--bg-shelf-shadow);
            /* inset 0px 42px 20px -35px var(--bg-shelf-shadow); */
            border-radius: 0 0 5px 5px;
            z-index: 0;
        }

        /* Sortable.js specific styles */
        .sortable-ghost {
            opacity: 0.3;
        }

        .sortable-drag {
            opacity: 1;
            cursor: grabbing;
            z-index: 9999;
        }

        /* Visual feedback when dragging over shelf */
        .bookshelf-row.sortable-drag-over {
            /* background: #6f3a1f; */
            background:
                linear-gradient(0deg, rgba(111, 58, 31, 1), transparent 70%),
                /* linear-gradient(0deg, rgba(111, 58, 31, 0.9), transparent 0%), */
                linear-gradient(180deg, rgba(245, 222, 179, 0.8), transparent 100%);
            /* background: linear-gradient(180deg, rgba(111, 58, 31, 0.8), rgba(245, 222, 179, 0.3)); */
            /* background: linear-gradient(0deg, rgba(111, 58, 31, 1), rgba(245, 222, 179, 0.3)); */
            /* color: rgba(245, 222, 179, 1); */
            box-shadow: 0 0 15px rgba(52, 152, 219, 0.5);
            /* opacity: ; */
        }

        .book {
            display: inline-flex;
            flex-shrink: 0;
            position: relative;
            cursor: grab;
            margin-right: 2px;
            margin-bottom: 0;
            z-index: 1;
            /* Smooth transitions for when books move out of the way */
            transition: transform 250ms cubic-bezier(0.2, 0, 0, 1);
            will-change: transform;
        }

        /* Smooth animation for books moving during drag */
        .book:not(.sortable-chosen):not(.sortable-drag) {
            transition: transform 250ms cubic-bezier(0.2, 0, 0, 1),
                box-shadow 200ms ease;
        }

        .book:active {
            cursor: grabbing;
        }

        /* Chosen item style - the item being dragged */
        .sortable-chosen {
            /* transform: rotate(2deg) scale(1.05); */
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            /* box-shadow: inset 0 0 1px rgba(0,0,0,0.4), 0 0 0 1px rgba(63, 63, 68, 0.05), 0 1px 3px 0 rgba(34, 33, 81, 0.15); */
            transition: none !important;
            /* Disable transition for dragged item for immediate response */
        }

        /* Item actively being dragged */
        .sortable-drag {
            transition: none !important;
            /* No transition for the dragged item itself */
        }

        /* Book spine styles */
        .book-spine {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            height: 150px;
            width: 30px;
            color: white;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            text-align: center;
            box-shadow: 5px 5px 5px var(--shadow-book);
            margin-bottom: 0;
            border-radius: 3px;
            font-size: 0.8rem;
            font-weight: 500;
            transition: box-shadow 200ms ease;
        }

        .spine-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 3px;
        }

        /* Controls panel */
        .controls-panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-panel);
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .controls-panel h3 {
            margin-top: 0;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .upload-control input[type="file"] {
            display: none;
        }

        .select-button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Placeholder for where item will be dropped */
        .sortable-placeholder {
            background-color: transparent;
            border: 2px solid transparent;
            border-radius: 3px;
            margin-right: 2px;
            transition: all 250ms cubic-bezier(0.2, 0, 0, 1);
        }

        /* Animation for books moving apart */
        .book.sortable-swap-highlight {
            background-color: rgba(52, 152, 219, 0.1);
        }

        /* Enhanced book spine transitions */
        .book-spine {
            transition: box-shadow 200ms ease;
        }

        /* Subtle highlight on books as you drag near them */
        .book:not(.sortable-chosen):hover .book-spine {
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.4);
        }

        /* Smooth sliding animation for bookshelf when items are being rearranged */
        .bookshelf-row.sortable-drag-active {
            transition: all 250ms cubic-bezier(0.2, 0, 0, 1);
        }

        /* Make margins animate smoothly too */
        .book {
            transition-property: transform, opacity, margin, box-shadow;
        }

        /* Ensure ghost placeholder animates smoothly into position */
        .sortable-ghost {
            opacity: 0.3;
            transition: opacity 150ms ease, transform 250ms cubic-bezier(0.2, 0, 0, 1);
        }

        /* Add a subtle scale to books adjacent to the drag position */
        .bookshelf-row:has(.sortable-chosen) .book:not(.sortable-chosen) {
            transition: transform 250ms cubic-bezier(0.2, 0, 0, 1),
                box-shadow 200ms ease,
                opacity 200ms ease;
        }

        /* Info banner */
        .info-banner {
            background: linear-gradient(135deg,
                    var(--info-gradient-start) 0%,
                    var(--info-gradient-end) 100%);
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px var(--shadow-panel);
            transition: background 0.3s ease;
        }

        .info-banner h3 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
        }

        .info-banner p {
            margin: 5px 0;
            font-size: 0.9rem;
        }

        /* Dark Mode Toggle Button */
        #theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--bg-secondary);
            border: 2px solid var(--border-panel);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 10px var(--shadow-panel);
            z-index: 10000;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
            padding: 0;
        }

        #theme-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 15px var(--shadow-book);
        }

        #theme-toggle:focus {
            outline: 2px solid var(--button-primary);
            outline-offset: 2px;
        }

        #theme-icon {
            font-size: 20px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        #theme-toggle:active #theme-icon {
            transform: rotate(20deg);
        }
    </style>
</head>

<body>
    <!-- Dark Mode Toggle Button -->
    <button id="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
        <span id="theme-icon">☀️</span>
    </button>

    <header>
        <h1>Virtual Bookshelf - Smooth Sortable</h1>
        <div class="controls">
            <button id="add-book-btn">Add Sample Book</button>
            <button id="add-shelf-btn">Add New Shelf</button>
            <button id="clear-all-btn">Clear All</button>
        </div>
    </header>

    <main class="app-container">
        <div class="bookshelf-main-area">
            <div class="bookshelf-container">
                <!-- <div class="info-banner">
                <h3>✨ Ultra-Smooth Drag & Drop</h3>
                <p>• Drag books to reorder them on any shelf</p>
                <p>• Watch books smoothly glide apart to preview where your book will land</p>
                <p>• Move books between shelves with buttery-smooth fluid animations</p>
                <p>• Experience seamless transitions as books elegantly make space</p>
            </div> -->

                <div class="controls-panel">
                    <h3>Upload Book Spine Images</h3>
                    <div class="upload-control">
                        <input type="file" id="spine-file-input" multiple accept="image/*">
                        <button id="select-files-btn" class="select-button">Choose Files</button>
                    </div>
                    <div id="selected-files-list" style="margin-top: 10px;">
                        <p>No files selected</p>
                    </div>
                </div>

                <div class="bookshelf" id="main-bookshelf">
                    <div class="bookshelf-row" id="shelf-1"></div>
                    <div class="bookshelf-row" id="shelf-2"></div>
                </div>
            </div> <!-- .bookshelf-container -->
        </div> <!-- .bookshelf-main-area -->

        <!-- Right Side Panel -->
        <aside id="side-panel" class="side-panel">
            <!-- Settings Section -->
            <div class="settings-section">
                <button class="settings-header" id="settings-header" aria-expanded="true"
                    aria-controls="settings-content">
                    <span>⚙️ Settings</span>
                    <span class="toggle-arrow" aria-hidden="true">▼</span>
                </button>
                <div class="settings-content" id="settings-content">
                    <div class="setting-group">
                        <label for="dpi-input">Screen DPI:</label>
                        <input type="number" id="dpi-input" value="96" min="50" max="300">
                        <button id="calibrate-btn" class="small-btn"
                            aria-label="Calibrate screen DPI">Calibrate</button>
                    </div>
                    <div class="setting-group">
                        <label for="default-shelf-height">Default Shelf Height (inches):</label>
                        <input type="number" id="default-shelf-height" value="12" min="6" max="24" step="0.5">
                    </div>
                    <button id="reset-settings-btn" class="small-btn"
                        aria-label="Reset all settings to default values">Reset to Defaults</button>
                </div>
            </div>

            <!-- Temporary Holding Area -->
            <div class="temporary-holding-section">
                <div class="holding-header">
                    <span>📚 Temporary Holding</span>
                    <span id="holding-count" class="count-badge">0 books</span>
                </div>
                <div class="holding-area" id="temporary-holding"></div>
            </div>
        </aside>
    </main>

    <footer>
        <p>&copy; 2026 Virtual Bookshelf - Smooth Sortable Edition</p>
    </footer>

    <script>
        // Dark Mode Theme Management
        (function initializeTheme() {
            // Check localStorage for saved preference, default to dark mode
            const savedTheme = localStorage.getItem('bookshelf-theme-preference') || 'dark';

            // Apply theme immediately to prevent flash
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
            }

            // Update icon to match current theme
            updateThemeIcon();
        })();

        function updateThemeIcon() {
            const themeIcon = document.getElementById('theme-icon');
            const isDarkMode = document.body.classList.contains('dark-mode');

            if (themeIcon) {
                // Show sun in dark mode (clicking will go to light)
                // Show moon in light mode (clicking will go to dark)
                themeIcon.textContent = isDarkMode ? '☀️' : '🌙';
            }
        }

        function toggleTheme() {
            const body = document.body;
            const isDarkMode = body.classList.contains('dark-mode');

            // Toggle the dark-mode class
            if (isDarkMode) {
                body.classList.remove('dark-mode');
                localStorage.setItem('bookshelf-theme-preference', 'light');
            } else {
                body.classList.add('dark-mode');
                localStorage.setItem('bookshelf-theme-preference', 'dark');
            }

            // Update icon with animation
            const themeIcon = document.getElementById('theme-icon');
            themeIcon.style.opacity = '0';
            themeIcon.style.transform = 'rotate(180deg)';

            setTimeout(() => {
                updateThemeIcon();
                themeIcon.style.opacity = '1';
                themeIcon.style.transform = 'rotate(0deg)';
            }, 150);
        }

        // Book colors for sample books
        const bookColors = [
            '#1abc9c', '#2ecc71', '#3498db', '#9b59b6', '#e74c3c',
            '#f39c12', '#d35400', '#c0392b', '#16a085', '#27ae60',
            '#2980b9', '#8e44ad', '#f1c40f', '#e67e22', '#95a5a6'
        ];

        // Book titles for sample books
        const bookTitles = [
            'The Great Adventure', 'Mystery of the Deep', 'Starry Night',
            'The Lost Treasure', 'Beyond the Horizon', 'Winter Dreams',
            'Summer Days', 'Autumn Leaves', 'Spring Flowers', 'Mountain Peak',
            'Ocean Waves', 'Desert Sands', 'Forest Whispers', 'City Lights',
            'River Flow', 'The Hidden Path', 'Secret Garden', 'Ancient Scrolls'
        ];

        let bookCounter = 1;
        let sortableInstances = [];

        // Physical sizing state
        let currentDPI = 96;
        let defaultShelfHeight = 12;
        let booksMetadata = {};

        document.addEventListener('DOMContentLoaded', function () {
            // Initialize sortable for existing shelves
            initializeSortable();

            // Add some sample books to start
            addSampleBook('shelf-1');
            addSampleBook('shelf-1');
            addSampleBook('shelf-1');
            addSampleBook('shelf-2');
            addSampleBook('shelf-2');

            // Set up event listeners
            document.getElementById('add-book-btn').addEventListener('click', () => addSampleBook('shelf-1'));
            document.getElementById('add-shelf-btn').addEventListener('click', addNewShelf);
            document.getElementById('clear-all-btn').addEventListener('click', clearAllShelves);
            document.getElementById('select-files-btn').addEventListener('click', function () {
                document.getElementById('spine-file-input').click();
            });
            document.getElementById('spine-file-input').addEventListener('change', handleFileSelection);

            // Set up theme toggle button
            document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

            // Load and apply settings
            loadSettings();

            // Set up settings event listeners
            document.getElementById('settings-header').addEventListener('click', toggleSettings);
            document.getElementById('dpi-input').addEventListener('change', handleDPIChange);
            document.getElementById('default-shelf-height').addEventListener('change', handleDefaultHeightChange);
            document.getElementById('calibrate-btn').addEventListener('click', openCalibrationModal);
            document.getElementById('reset-settings-btn').addEventListener('click', resetSettings);

            // Initialize temporary holding sortable
            initializeTemporaryHolding();
        });

        /**
         * Initialize SortableJS on all bookshelves
         * This creates the smooth drag and drop functionality with visual feedback
         */
        function initializeSortable() {
            const shelves = document.querySelectorAll('.bookshelf-row');

            shelves.forEach(shelf => {
                // Skip if already initialized
                if (shelf.hasAttribute('data-sortable-initialized')) return;

                const sortable = Sortable.create(shelf, {
                    group: 'books', // Allow dragging between shelves
                    animation: 250, // Animation speed in ms - matches CSS transition
                    easing: 'cubic-bezier(0.2, 0, 0, 1)', // Smooth easing - matches CSS for fluid motion
                    ghostClass: 'sortable-ghost', // Class for the drop placeholder
                    chosenClass: 'sortable-chosen', // Class for the chosen item
                    dragClass: 'sortable-drag', // Class for the dragging item

                    // Enhanced animation settings
                    forceFallback: false, // Use HTML5 drag and drop if available
                    fallbackOnBody: true,
                    swapThreshold: 0.65, // Threshold for swap mode
                    invertSwap: false, // Don't invert swap when moving
                    direction: 'horizontal', // Optimize for horizontal sorting
                    bubbleScroll: true, // Enable auto-scroll when near edges

                    // Callbacks
                    onStart: function (evt) {
                        // Add visual feedback when drag starts
                        document.querySelectorAll('.bookshelf-row').forEach(s => {
                            if (s !== evt.from) {
                                s.style.outline = '2px dashed #3498db';
                                s.style.outlineOffset = '5px';
                            }
                            // Add class for smooth animations during drag
                            s.classList.add('sortable-drag-active');
                        });
                    },

                    onEnd: function (evt) {
                        // Remove visual feedback when drag ends
                        document.querySelectorAll('.bookshelf-row').forEach(s => {
                            s.style.outline = '';
                            s.style.outlineOffset = '';
                            // Remove drag active class
                            s.classList.remove('sortable-drag-active');
                            s.classList.remove('sortable-drag-over');
                        });

                        // Save the new order
                        saveBookshelfOrder();

                        // Log the move for debugging
                        console.log(`Moved book from shelf ${evt.from.id} to ${evt.to.id}, position ${evt.newIndex}`);
                    },

                    // Update visual feedback when dragging over different shelves
                    onMove: function (evt) {
                        const toShelf = evt.to;
                        const fromShelf = evt.from;

                        // Add highlight to target shelf
                        if (toShelf !== fromShelf) {
                            toShelf.classList.add('sortable-drag-over');
                        }

                        return true; // Allow the move
                    },

                    onChange: function (evt) {
                        // This fires when the order changes while dragging
                        // Books automatically part to show where the dragged book will go
                    }
                });

                sortableInstances.push(sortable);
                shelf.setAttribute('data-sortable-initialized', 'true');
            });

            console.log('Sortable initialized on all shelves');
        }

        /**
         * Add a new sample book to a specific shelf
         */
        function addSampleBook(shelfId) {
            const shelf = document.getElementById(shelfId) || document.querySelector('.bookshelf-row');
            if (!shelf) return;

            const bookId = `book-${bookCounter++}`;
            const color = bookColors[Math.floor(Math.random() * bookColors.length)];
            const title = bookTitles[Math.floor(Math.random() * bookTitles.length)];

            const book = document.createElement('div');
            book.className = 'book';
            book.id = bookId;

            const spine = document.createElement('div');
            spine.className = 'book-spine';
            spine.style.backgroundColor = color;
            spine.textContent = title;

            book.appendChild(spine);
            shelf.appendChild(book);

            // Add entrance animation
            book.style.transform = 'scale(0.8)';
            book.style.opacity = '0';
            setTimeout(() => {
                book.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
                book.style.transform = 'scale(1)';
                book.style.opacity = '1';
                setTimeout(() => {
                    book.style.transition = '';
                }, 300);
            }, 10);

            saveBookshelfOrder();
        }

        /**
         * Add a new bookshelf row
         */
        function addNewShelf() {
            const bookshelf = document.getElementById('main-bookshelf');
            const shelfCount = bookshelf.querySelectorAll('.bookshelf-row').length;

            const newShelf = document.createElement('div');
            newShelf.className = 'bookshelf-row';
            newShelf.id = `shelf-${shelfCount + 1}`;

            bookshelf.appendChild(newShelf);

            // Initialize sortable on the new shelf
            const sortable = Sortable.create(newShelf, {
                group: 'books',
                animation: 250, // Matches CSS transition timing
                easing: 'cubic-bezier(0.2, 0, 0, 1)', // Smooth easing
                ghostClass: 'sortable-ghost',
                chosenClass: 'sortable-chosen',
                dragClass: 'sortable-drag',
                forceFallback: false,
                fallbackOnBody: true,
                swapThreshold: 0.65,
                invertSwap: false,
                direction: 'horizontal',
                bubbleScroll: true,

                onStart: function (evt) {
                    document.querySelectorAll('.bookshelf-row').forEach(s => {
                        if (s !== evt.from) {
                            s.style.outline = '2px dashed #3498db';
                            s.style.outlineOffset = '5px';
                        }
                        s.classList.add('sortable-drag-active');
                    });
                },

                onEnd: function (evt) {
                    document.querySelectorAll('.bookshelf-row').forEach(s => {
                        s.style.outline = '';
                        s.style.outlineOffset = '';
                        s.classList.remove('sortable-drag-active');
                        s.classList.remove('sortable-drag-over');
                    });
                    saveBookshelfOrder();
                }
            });

            sortableInstances.push(sortable);
            newShelf.setAttribute('data-sortable-initialized', 'true');

            // Add entrance animation
            newShelf.style.transform = 'translateY(-20px)';
            newShelf.style.opacity = '0';
            setTimeout(() => {
                newShelf.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
                newShelf.style.transform = 'translateY(0)';
                newShelf.style.opacity = '1';
                setTimeout(() => {
                    newShelf.style.transition = '';
                }, 300);
            }, 10);
        }

        /**
         * Clear all shelves
         */
        function clearAllShelves() {
            if (confirm('Are you sure you want to clear all books from all shelves?')) {
                document.querySelectorAll('.bookshelf-row').forEach(shelf => {
                    while (shelf.firstChild) {
                        shelf.removeChild(shelf.firstChild);
                    }
                });
                localStorage.removeItem('bookshelfOrder');
            }
        }

        /**
         * Handle file selection for book spine images
         */
        function handleFileSelection() {
            const fileInput = document.getElementById('spine-file-input');
            const selectedFilesList = document.getElementById('selected-files-list');
            const files = fileInput.files;

            if (files.length > 0) {
                selectedFilesList.innerHTML = '';

                Array.from(files).forEach(file => {
                    const fileItem = document.createElement('div');
                    fileItem.textContent = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
                    selectedFilesList.appendChild(fileItem);

                    processSpineImage(file);
                });
            } else {
                selectedFilesList.innerHTML = '<p>No files selected</p>';
            }
        }

        /**
         * Process a spine image file
         */
        function processSpineImage(file) {
            const imageUrl = URL.createObjectURL(file);
            const img = new Image();

            img.onload = function () {
                createBookWithSpineImage({
                    fileName: file.name,
                    url: imageUrl,
                    width: Math.max(30, Math.floor(img.width * 0.2)),
                    height: Math.max(120, Math.floor(img.height * 0.2))
                });
            };
            img.src = imageUrl;
        }

        /**
         * Create a book with a spine image
         */
        function createBookWithSpineImage(spineData) {
            const shelf = document.querySelector('.bookshelf-row');
            if (!shelf) return;

            const bookId = `book-${bookCounter++}-${spineData.fileName.replace(/[^a-z0-9]/gi, '-')}`;

            const book = document.createElement('div');
            book.className = 'book';
            book.id = bookId;

            const spine = document.createElement('div');
            spine.className = 'book-spine';
            spine.style.width = `${spineData.width}px`;
            spine.style.height = `${spineData.height}px`;

            const spineImg = document.createElement('img');
            spineImg.src = spineData.url;
            spineImg.alt = `Book spine for ${spineData.fileName}`;
            spineImg.className = 'spine-image';

            spine.appendChild(spineImg);
            book.appendChild(spine);
            shelf.appendChild(book);

            // Add entrance animation
            book.style.transform = 'scale(0.8) translateY(-20px)';
            book.style.opacity = '0';
            setTimeout(() => {
                book.style.transition = 'transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55), opacity 0.3s ease';
                book.style.transform = 'scale(1) translateY(0)';
                book.style.opacity = '1';
                setTimeout(() => {
                    book.style.transition = '';
                }, 400);
            }, 10);

            saveBookshelfOrder();
        }

        /**
         * Load settings from localStorage
         */
        function loadSettings() {
            const savedDPI = localStorage.getItem('bookshelf-dpi');
            const savedHeight = localStorage.getItem('bookshelf-default-shelf-height');
            const savedMetadata = localStorage.getItem('bookshelf-books-metadata');

            if (savedDPI) {
                currentDPI = parseInt(savedDPI);
                document.getElementById('dpi-input').value = currentDPI;
            }

            if (savedHeight) {
                defaultShelfHeight = parseFloat(savedHeight);
                document.getElementById('default-shelf-height').value = defaultShelfHeight;
            }

            if (savedMetadata) {
                try {
                    booksMetadata = JSON.parse(savedMetadata);
                } catch (e) {
                    console.error('Failed to parse books metadata:', e);
                    booksMetadata = {};
                }
            }

            console.log('Settings loaded:', { currentDPI, defaultShelfHeight });
        }

        /**
         * Save the bookshelf order to localStorage
         */
        function saveBookshelfOrder() {
            const shelves = document.querySelectorAll('.bookshelf-row');
            const order = {};

            shelves.forEach((shelf, shelfIndex) => {
                const bookIds = [];
                shelf.querySelectorAll('.book').forEach(book => {
                    bookIds.push(book.id);
                });
                order[shelf.id] = bookIds;
            });

            localStorage.setItem('bookshelfOrder', JSON.stringify(order));
            console.log('Saved bookshelf order:', order);
        }

        /**
         * Load bookshelf order from localStorage
         */
        function loadBookshelfOrder() {
            const savedOrder = localStorage.getItem('bookshelfOrder');
            if (savedOrder) {
                try {
                    const order = JSON.parse(savedOrder);
                    console.log('Loaded bookshelf order:', order);
                    // TODO: Implement restoration of book order
                } catch (e) {
                    console.error('Failed to parse saved order:', e);
                }
            }
        }
    </script>
</body>
